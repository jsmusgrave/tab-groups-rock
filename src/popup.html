<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="popup.css" />
	<title>Tab Groups Rock</title>
</head>
<body>
	<header>
		<h1>Tab Groups Rock</h1>
		<button id="settings-btn" title="Settings" aria-label="Settings">&#9881;</button>
	</header>

	<div id="no-vault-notice" hidden>
		No vault configured yet. <a href="#" id="open-settings-link">Add a vault name in settings</a>.
	</div>

	<label class="select-all-row" id="select-all-row" hidden>
		<input id="select-all-checkbox" type="checkbox" />
		Select all
	</label>

	<div id="group-list"></div>

	<div class="field-row">
		<label for="folder-input">Folder</label>
		<input id="folder-input" type="text" />
	</div>

	<label class="checkbox-row">
		<input id="close-after-save" type="checkbox" />
		Close group after saving
	</label>

	<div class="actions">
		<button id="primary-btn" class="primary">Add to Obsidian</button>
		<div class="more-wrap">
			<button
				id="more-btn"
				class="more"
				aria-haspopup="true"
				aria-expanded="false"
				title="Run another action once. This does not change your default action, which is set in Settings."
			>&#9662;</button>
			<div id="more-menu" class="more-menu" hidden></div>
		</div>
	</div>
	<p class="helper-text">
		The &#9662; menu runs an action once without changing your default (set in Settings).
	</p>

	<div id="status"></div>

	<script type="module" src="popup.js"></script>
</body>
</html>
