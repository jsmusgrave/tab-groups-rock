<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title data-i18n="optionsTitle">Tab Groups Rock — Settings</title>
	<style>
		:root {
			color-scheme: light dark;
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			max-width: 480px;
			margin: 40px auto;
			padding: 0 16px;
			color: #1f1f1f;
			background: #ffffff;
		}
		@media (prefers-color-scheme: dark) {
			body {
				color: #e8e8e8;
				background: #1e1f22;
			}
			input,
			select {
				background: #2a2b2e;
				color: #e8e8e8;
				border-color: #444;
			}
		}
		h1 {
			font-size: 18px;
		}
		fieldset {
			border: 1px solid #d0d0d0;
			border-radius: 8px;
			margin-bottom: 16px;
			padding: 12px 16px;
		}
		legend {
			font-weight: 600;
			font-size: 13px;
		}
		label.field {
			display: block;
			font-size: 12px;
			margin-bottom: 4px;
			opacity: 0.75;
		}
		select {
			width: 100%;
			padding: 6px 8px;
			border-radius: 4px;
			border: 1px solid #ccc;
			margin-bottom: 12px;
			box-sizing: border-box;
			font: inherit;
		}
		input[type='text'] {
			width: 100%;
			padding: 6px 8px;
			border-radius: 4px;
			border: 1px solid #ccc;
			margin-bottom: 12px;
			box-sizing: border-box;
		}
		label.checkbox {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 8px;
			font-size: 13px;
		}
		#saved-indicator {
			font-size: 12px;
			color: #188038;
			height: 16px;
		}
	</style>
</head>
<body>
	<h1 data-i18n="optionsTitle">Tab Groups Rock — Settings</h1>

	<fieldset>
		<legend data-i18n="sectionObsidian">Obsidian</legend>
		<label class="field" for="vault-name" data-i18n="vaultNameLabel">Vault name (must match Obsidian exactly)</label>
		<input id="vault-name" type="text" data-i18n-placeholder="vaultNamePlaceholder" />

		<label class="field" for="folder" data-i18n="defaultFolderLabel">Default folder</label>
		<input id="folder" type="text" placeholder="Tab Groups/" />
	</fieldset>

	<fieldset>
		<legend data-i18n="sectionPopup">Popup</legend>
		<label class="field" for="primary-action" data-i18n="primaryActionLabel">Main button action</label>
		<select id="primary-action">
			<option value="addToObsidian" data-i18n="actionAddToObsidian">Add to Obsidian</option>
			<option value="saveFile" data-i18n="actionSaveFile">Save file</option>
			<option value="copyToClipboard" data-i18n="actionCopyToClipboard">Copy to clipboard</option>
		</select>
	</fieldset>

	<fieldset>
		<legend data-i18n="sectionBehavior">Behavior</legend>
		<label class="checkbox">
			<input id="skip-pinned" type="checkbox" />
			<span data-i18n="skipPinned">Skip pinned tabs</span>
		</label>
		<label class="checkbox">
			<input id="skip-restricted" type="checkbox" />
			<span data-i18n="skipRestricted"></span>
		</label>
		<label class="checkbox">
			<input id="write-bookmarks" type="checkbox" />
			<span data-i18n="writeBookmarks"></span>
		</label>
	</fieldset>

	<div id="saved-indicator"></div>

	<script type="module" src="options.js"></script>
</body>
</html>
