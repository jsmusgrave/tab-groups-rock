<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Saving to Obsidian</title>
	<style>
		:root {
			color-scheme: light dark;
			--fg: #1f1f1f;
			--bg: #ffffff;
			--muted: #6b7280;
			--border: #e2e2e2;
			--ok: #188038;
			--warn: #b06000;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--fg: #e8e8e8;
				--bg: #1e1f22;
				--muted: #9aa0a6;
				--border: #3a3b3e;
				--ok: #81c995;
				--warn: #fdd663;
			}
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			max-width: 480px;
			margin: 64px auto;
			padding: 0 16px;
			color: var(--fg);
			background: var(--bg);
		}
		h1 {
			font-size: 18px;
		}
		ul {
			list-style: none;
			padding: 0;
			border-top: 1px solid var(--border);
		}
		li {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			padding: 8px 0;
			border-bottom: 1px solid var(--border);
		}
		.status {
			color: var(--muted);
			white-space: nowrap;
		}
		.status.sent {
			color: var(--ok);
		}
		.status.sent-in-uri {
			color: var(--warn);
		}
		#message {
			color: var(--muted);
		}
		button {
			font: inherit;
			padding: 6px 14px;
			margin-right: 8px;
		}
	</style>
</head>
<body>
	<h1 id="heading">Saving to Obsidian</h1>
	<ul id="note-list"></ul>
	<p id="message"></p>
	<button id="next-btn" type="button" hidden></button>
	<button id="close-tabs-btn" type="button" hidden></button>
	<button id="done-btn" type="button" hidden></button>
	<script type="module" src="save.js"></script>
</body>
</html>
